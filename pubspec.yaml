name: reconx_mobile
description: "ReconX Mobile Companion — Real-time Android Notification Sync Agent & Receipt Scanner for Personal Bank & E-Wallet Transactions."
publish_to: 'none'
version: 1.3.9+13

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  google_fonts: ^6.2.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  permission_handler: ^11.3.1
  google_mlkit_text_recognition: ^0.13.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logos/
