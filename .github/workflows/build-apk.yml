name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Generate Official Android Platform Files
        run: |
          flutter create --org com.reconx.agent --project-name reconx_mobile /tmp/temp_app
          mkdir -p android
          cp -r /tmp/temp_app/android/* android/
          chmod +x android/gradlew
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true

      - name: Overlay ReconX Notification Interceptor & Resources
        run: |
          mkdir -p android/app/src/main/res
          cp -r custom_android/res/* android/app/src/main/res/
          cp custom_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/reconx/agent
          cp custom_android/MainActivity.kt android/app/src/main/kotlin/com/reconx/agent/MainActivity.kt
          cp custom_android/ReconXNotificationListener.kt android/app/src/main/kotlin/com/reconx/agent/ReconXNotificationListener.kt

      - name: Install Dependencies
        run: flutter pub get

      - name: Build & Package Release APK
        run: |
          flutter build apk --release
          echo "=== Output files in build/app/outputs ==="
          ls -R build/app/outputs/ || true
          mkdir -p dist
          APK_PATH=$(find build/app/outputs -type f -name "*.apk" | head -n 1)
          echo "Selected APK: $APK_PATH"
          cp "$APK_PATH" dist/ReconX-Companion-v1.0.0.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconX-Companion-v1.0.0-APK
          path: |
            dist/ReconX-Companion-v1.0.0.apk
            build/app/outputs/**/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "ReconX Mobile Companion v1.0.0"
          body: |
            ### 📱 ReconX Mobile Companion (Release APK)
            
            **Unduh dan Install di Android:**
            Download file `ReconX-Companion-v1.0.0.apk` di bawah ini, lalu buka dan install langsung pada smartphone Android Anda.

            #### 🚀 Fitur Terintegrasi:
            - **Background Notification Interceptor:** Memantau otomatis notifikasi pembayaran masuk di status bar HP.
            - **10 Ekosistem Terkoneksi:** Pluang, Bibit, Bareksa, Ajaib, Stockbit, blu BCA, SeaBank, Superbank, ShopeePay, Tokopedia, OVO.
            - **Direct Sync ke Server Live:** Terhubung otomatis ke `https://reconx.ramuni.id/api/v1`.
            - **Anti-Double Counting Engine:** Nominal rupiah tidak akan dobel hitung saat menerima notifikasi HP dan email bukti transaksi sekaligus.
            - **Multi-Tenant Family Household Support:** Mendukung pairing multi-aplikasi ke Family Group `FAM-KVN-8821`.
            - **Google OAuth 2.0 Single Sign-On:** Sesi login aman dan terverifikasi.
          files: |
            dist/ReconX-Companion-v1.0.0.apk
            build/app/outputs/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
