name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Clean & Generate Official Android Platform Files
        run: |
          rm -rf android
          flutter create . --platforms android --org com.reconx.agent --project-name reconx_mobile -a kotlin
          chmod +x android/gradlew
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' {} + || true

      - name: Configure Notification Interceptor, Camera & Biometric Permissions
        run: |
          mkdir -p android/app/src/main/res
          cp -r custom_android/res/* android/app/src/main/res/
          find android/app/src/main -name "MainActivity.*" -delete || true
          mkdir -p android/app/src/main/kotlin/com/reconx/agent/reconx_mobile
          cp custom_android/MainActivity.kt android/app/src/main/kotlin/com/reconx/agent/reconx_mobile/MainActivity.kt
          cp custom_android/ReconXNotificationListener.kt android/app/src/main/kotlin/com/reconx/agent/reconx_mobile/ReconXNotificationListener.kt
          python3 -c "
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              c = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>
              <uses-permission android:name=\"android.permission.CAMERA\"/>
              <uses-permission android:name=\"android.permission.USE_BIOMETRIC\"/>
              <uses-permission android:name=\"android.permission.USE_FINGERPRINT\"/>
          '''
          srv = '''
                  <service
                      android:name=\"com.reconx.agent.reconx_mobile.ReconXNotificationListener\"
                      android:label=\"ReconX Financial Notification Interceptor\"
                      android:permission=\"android.permission.BIND_NOTIFICATION_LISTENER_SERVICE\"
                      android:exported=\"true\">
                      <intent-filter>
                          <action android:name=\"android.service.notification.NotificationListenerService\" />
                      </intent-filter>
                  </service>
          '''
          c = c.replace('<application', perms + '    <application', 1)
          c = c.replace('</application>', srv + '    </application>', 1)
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(c)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Build Release APK
        id: build_step
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          flutter build apk --release --no-tree-shake-icons --verbose > build.log 2>&1 || {
            echo "::error::Flutter build apk failed!"
            echo "==================== BUILD ERROR TAIL ===================="
            tail -n 250 build.log
            exit 1
          }

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.log
          retention-days: 7

      - name: Verify Build & Prepare Distribution
        run: |
          APK_FILE=$(find build/ -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build/ -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "::error::Flutter APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          mkdir -p dist
          cp "$APK_FILE" dist/ReconX-Companion-v1.1.0.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconX-Companion-v1.1.0-APK
          path: dist/ReconX-Companion-v1.1.0.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "ReconX Mobile Companion v1.1.0"
          draft: false
          prerelease: false
          overwrite: true
          body: |
            ### ReconX Mobile Companion v1.1.0 Release
            
            Official Android Companion APK for **ReconX Financial Clearing & Family Reconciliation Engine**.
            
            - 🚀 **Bottom Navigation:** 5 modul utama (Beranda, Mutasi, Scan Nota Fisik, Keluarga, & Pengaturan).
            - 📸 **Receipt & Payment Scanner:** Auto capture via kamera & upload nota fisik dengan AI OCR expense extractor.
            - 🔐 **Biometric Security:** Buka aplikasi dengan Sidik Jari (Fingerprint / Face Unlock).
            - 🎨 **Unified App Icon:** Launcher icon dan internal branding 100% seragam dengan versi Web ReconX.
            - 📡 **Notification Interceptor:** BCA, Superbank, SeaBank, Mandiri Livin, BRImo, BNI, ShopeePay, GoPay, OVO, DANA.
            - 👨‍👩‍👧‍👦 **Multi-Tenant SaaS Cluster:** Hubungkan akun ke dashboard web (PIN unik `FAM-XXX-XXXX`).
            - 🚪 **Logout & Factory Reset:** Keluar akun dengan aman dan reset data lokal.
            
            #### 📥 Download & Install:
            Download file **`ReconX-Companion-v1.1.0.apk`** di bawah ini dan install langsung di HP Android Anda.
          files: dist/ReconX-Companion-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
