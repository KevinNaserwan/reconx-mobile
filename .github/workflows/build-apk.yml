name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Clean & Generate Official Android Platform Files
        run: |
          rm -rf android
          flutter create . --platforms android --org com.reconx.agent --project-name reconx_mobile
          chmod +x android/gradlew
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true

      - name: Configure Notification Interceptor & Android Permissions
        run: |
          mkdir -p android/app/src/main/res
          cp -r custom_android/res/* android/app/src/main/res/
          mkdir -p android/app/src/main/kotlin/com/reconx/agent/reconx_mobile
          cp custom_android/MainActivity.kt android/app/src/main/kotlin/com/reconx/agent/reconx_mobile/MainActivity.kt
          cp custom_android/ReconXNotificationListener.kt android/app/src/main/kotlin/com/reconx/agent/reconx_mobile/ReconXNotificationListener.kt
          python3 -c "
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              c = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>
          '''
          srv = '''
                  <service
                      android:name=\".ReconXNotificationListener\"
                      android:label=\"ReconX Financial Notification Interceptor\"
                      android:permission=\"android.permission.BIND_NOTIFICATION_LISTENER_SERVICE\"
                      android:exported=\"true\">
                      <intent-filter>
                          <action android:name=\"android.service.notification.NotificationListenerService\" />
                      </intent-filter>
                  </service>
          '''
          c = c.replace('<application', perms + '    <application', 1)
          c = c.replace('</application>', srv + '    </application>', 1)
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(c)
          "
          cat android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          flutter build apk --release --no-tree-shake-icons
          mkdir -p dist
          APK_FILE=$(find build/ -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" 2>/dev/null | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/ReconX-Companion-v1.0.0.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconX-Companion-v1.0.0-APK
          path: dist/ReconX-Companion-v1.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "ReconX Mobile Companion v1.0.0"
          draft: false
          prerelease: false
          body: |
            ### ReconX Mobile Companion v1.0.0 Release
            
            Official Android Companion APK for **ReconX Financial Clearing & Family Reconciliation Engine**.
            
            - 📡 **Real-Time Notification Interceptor:** Reads notifications from BCA, Superbank, SeaBank, Mandiri Livin, BRImo, BNI, ShopeePay, GoPay, OVO, and DANA.
            - 🔐 **Anti-Double Counting Engine:** Correlates multi-channel notifications and eliminates internal household transfers.
            - 👨‍👩‍👧‍👦 **Multi-Tenant Family Sync:** Links directly to the dashboard (`https://reconx.ramuni.id`) via invite PIN `FAM-KVN-8821`.
            
            #### 📥 Download & Install:
            Download **`ReconX-Companion-v1.0.0.apk`** below and install it directly on your Android phone.
          files: dist/ReconX-Companion-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
