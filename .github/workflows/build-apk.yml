name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Clean & Generate Official Android Platform Files
        run: |
          rm -rf android
          flutter create . --platforms android --org com.reconx.agent --project-name reconx_mobile -a kotlin
          chmod +x android/gradlew
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' {} + || true

      - name: Configure Notification Interceptor, Camera & Biometric Permissions
        run: |
          mkdir -p android/app/src/main/res
          cp -r custom_android/res/* android/app/src/main/res/
          find android/app/src/main -name "MainActivity.*" -delete || true
          mkdir -p android/app/src/main/kotlin/com/reconx/agent/reconx_mobile
          cp custom_android/MainActivity.kt android/app/src/main/kotlin/com/reconx/agent/reconx_mobile/MainActivity.kt
          cp custom_android/ReconXNotificationListener.kt android/app/src/main/kotlin/com/reconx/agent/reconx_mobile/ReconXNotificationListener.kt
          mkdir -p ~/.android
          cp custom_android/debug.keystore ~/.android/debug.keystore
          cp custom_android/reconx-release.jks android/app/reconx-release.jks
          python3 custom_android/configure_android.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || {
            echo "::error::Flutter analyze failed!"
            echo "==================== ANALYZE LOG ===================="
            cat analyze.log
            git config --global user.email "bot@reconx.io"
            git config --global user.name "ReconX Builder"
            git checkout -B build-log
            cp analyze.log log.txt
            git add log.txt
            git commit -m "debug: analyze log" || true
            git push -f origin build-log || true
            exit 1
          }

      - name: Build Release APK
        id: build_step
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          flutter build apk --release --no-shrink --no-tree-shake-icons --verbose > build.log 2>&1 || {
            echo "::error::Flutter build apk failed!"
            echo "==================== BUILD ERROR TAIL ===================="
            tail -n 250 build.log
            git config --global user.email "bot@reconx.io"
            git config --global user.name "ReconX Builder"
            git checkout -B build-log
            grep -B 10 -A 25 "compileReleaseKotlin" build.log > log.txt || tail -n 1500 build.log > log.txt
            git add log.txt
            git commit -m "debug: build error log" || true
            git push -f origin build-log || true
            exit 1
          }

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.log
          retention-days: 7

      - name: Verify Build & Prepare Distribution
        run: |
          APK_FILE=$(find build/ -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build/ -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "::error::Flutter APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          mkdir -p dist
          cp "$APK_FILE" dist/Reconx-v1.3.13.apk
          cp "$APK_FILE" dist/Reconx-v1.3.12.apk
          cp "$APK_FILE" dist/Reconx-v1.3.11.apk
          cp "$APK_FILE" dist/Reconx-v1.3.10.apk
          cp "$APK_FILE" dist/Reconx-v1.3.9.apk
          cp "$APK_FILE" dist/Reconx-v1.3.8.apk
          cp "$APK_FILE" dist/Reconx-v1.3.7.apk
          cp "$APK_FILE" dist/Reconx-v1.3.6.apk
          cp "$APK_FILE" dist/Reconx-v1.3.5.apk
          cp "$APK_FILE" dist/Reconx-v1.3.4.apk
          cp "$APK_FILE" dist/Reconx-v1.3.3.apk
          cp "$APK_FILE" dist/Reconx-v1.3.2.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reconx-v1.3.13-APK
          path: dist/Reconx-v1.3.13.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.13
          name: "Reconx Android v1.3.13 (Support Format Nota Harga Tunai, Rekonsiliasi Tunai-Kembali & Multi-Channel Web Filter)"
          draft: false
          prerelease: false
          overwrite: true
          body: |
            ### Reconx Android v1.3.13 Official Release

            Pembaruan komprehensif dataset pengenalan nota fisik di Indonesia (dukungan format nota tanpa kata TOTAL seperti HARGA TUNAI, RUPIAH SPBU, TARIF parkir, serta rekonsiliasi aritmatika Tunai minus Kembali):

            - 🧾 **Dukungan Penuh Beragam Format Nota di Indonesia:**
              - **Format Tanpa Kata TOTAL (Harga Tunai):** Mengenali kata kunci `HARGA TUNAI`, `BAYAR TUNAI`, `UANG TUNAI`, `PEMBAYARAN TUNAI`, `TOTAL TUNAI` yang sering dipakai warung makan, depot, dan nota kontan toko kelontong.
              - **Aritmatika Cerdas Tunai - Kembali:** Jika nota hanya mencantumkan nominal uang diserahkan (`TUNAI: 50.000`) dan uang kembalian (`KEMBALI: 15.000`), sistem secara otomatis menghitung nilai riil belanja = Rp 35.000.
              - **Struk SPBU & Bensin (Pertamina / Shell):** Mengenali kata kunci khusus SPBU seperti `RUPIAH`, `JML RUPIAH`, `TOTAL (RP)` untuk transaksi pengisian bahan bakar.
              - **Struk Parkir, Transportasi & Apotek:** Mendukung keyword `TARIF`, `BIAYA PARKIR`, `BIAYA TIKET`, `TOTAL RESEP`, dan `HARGA OBAT`.
              - **Multi-Item Line Summation Fallback:** Jika bagian bawah nota terpotong atau buram, sistem secara cerdas menjumlahkan baris-baris harga barang yang terdeteksi.
            - ⚡ **Penyempurnaan Review Hasil Scan & Tombol Penyesuaian Cepat:**
              - Indikator akurasi OCR (*Confidence Tag*).
              - Chip penyesuaian cepat nominal (+Rp 1rb, +Rp 5rb, +Rp 10rb, +Rp 50rb) untuk koreksi instan.
              - Otomatis memilih metode pembayaran `Tunai (Cash)` bila terdeteksi transaksi tunai.
            - 🌐 **Web Dashboard Multi-Channel Quick Filters:**
              - Filter cepat di Web Internal Ledger: `Semua Mutasi`, `Uang Keluar`, `Uang Masuk`, `Scan Nota Fisik`, `QRIS & E-Wallet`, dan `Transfer Bank`.

            #### 📥 Download Langsung:
            Download file **`Reconx-v1.3.13.apk`** di bawah ini dan pasang langsung di HP Android Anda.
          files: |
            dist/Reconx-v1.3.13.apk
            dist/Reconx-v1.3.12.apk
            dist/Reconx-v1.3.11.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
