name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Clean & Generate Official Android Platform Files
        run: |
          rm -rf android
          flutter create . --platforms android --org com.reconx.agent --project-name reconx_mobile -a kotlin
          chmod +x android/gradlew
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' {} + || true

      - name: Configure Notification Interceptor, Camera & Biometric Permissions
        run: |
          mkdir -p android/app/src/main/res
          cp -r custom_android/res/* android/app/src/main/res/
          find android/app/src/main -name "MainActivity.*" -delete || true
          mkdir -p android/app/src/main/kotlin/com/reconx/agent/reconx_mobile
          cp custom_android/MainActivity.kt android/app/src/main/kotlin/com/reconx/agent/reconx_mobile/MainActivity.kt
          cp custom_android/ReconXNotificationListener.kt android/app/src/main/kotlin/com/reconx/agent/reconx_mobile/ReconXNotificationListener.kt
          mkdir -p ~/.android
          cp custom_android/debug.keystore ~/.android/debug.keystore
          cp custom_android/reconx-release.jks android/app/reconx-release.jks
          python3 custom_android/configure_android.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || {
            echo "::error::Flutter analyze failed!"
            echo "==================== ANALYZE LOG ===================="
            cat analyze.log
            git config --global user.email "bot@reconx.io"
            git config --global user.name "ReconX Builder"
            git checkout -B build-log
            cp analyze.log log.txt
            git add log.txt
            git commit -m "debug: analyze log" || true
            git push -f origin build-log || true
            exit 1
          }

      - name: Build Release APK
        id: build_step
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          flutter build apk --release --no-tree-shake-icons --verbose > build.log 2>&1 || {
            echo "::error::Flutter build apk failed!"
            echo "==================== BUILD ERROR TAIL ===================="
            tail -n 250 build.log
            git config --global user.email "bot@reconx.io"
            git config --global user.name "ReconX Builder"
            git checkout -B build-log
            tail -n 500 build.log > log.txt
            git add log.txt
            git commit -m "debug: build error log" || true
            git push -f origin build-log || true
            exit 1
          }

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.log
          retention-days: 7

      - name: Verify Build & Prepare Distribution
        run: |
          APK_FILE=$(find build/ -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build/ -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "::error::Flutter APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          mkdir -p dist
          cp "$APK_FILE" dist/Reconx-v1.3.0.apk
          cp "$APK_FILE" dist/Reconx-v1.2.0.apk
          cp "$APK_FILE" dist/ReconX-Companion-v1.1.0.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reconx-v1.3.0-APK
          path: dist/Reconx-v1.3.0.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: "Reconx Android v1.3.0"
          draft: false
          prerelease: false
          overwrite: true
          body: |
            ### Reconx Android v1.3.0 Release
            
            Pembaruan besar antarmuka (UI/UX) dan fitur personalisasi aplikasi Android **Reconx**:
            
            - 🌓 **White & Dark Mode:** Dukungan tema Terang (White) dan Gelap (Dark) yang fleksibel dengan toggle instan.
            - 🏷️ **Custom Brand Badges:** Icon transaksi bervariasi dengan visual brand resmi (QRIS, GoPay, OVO, DANA, ShopeePay, BCA, Mandiri, BRI, SeaBank, dll.) menggantikan centang generic.
            - 🔔 **Filter Notifikasi Bank & E-Wallet:** Kontrol penuh untuk memilih sumber aplikasi finansial mana saja yang diizinkan untuk dibaca dan disinkronkan.
            - 📷 **Viewfinder Scanner Ala GoPay:** Antarmuka scanner in-app modern dengan animasi laser scanning, glowing corner brackets, dan kontrol senter/galeri.
            - 🎟️ **Voucher PIN Undangan Rapi:** Kartu PIN keluarga yang lebih rapi, elegan, dan mudah disalin untuk menghubungkan akun pasangan.
            - 👤 **Lengkapi Data Profil:** Dialog pengaturan data pribadi (Nama, Email, WhatsApp, Peran Finansial Keluarga).
            - 🚪 **Tombol Logout Merah & Pembersihan:** Tombol keluar beraksen merah tegas dan penghapusan tombol tes server teknis.
            - 🛡️ **Persistent Keystore:** Kunci sertifikat resmi permanen untuk update mulus tanpa bentrok paket.
            
            #### 📥 Download Langsung:
            Download file **`Reconx-v1.3.0.apk`** di bawah ini dan install langsung di HP Android Anda.
          files: |
            dist/Reconx-v1.3.0.apk
            dist/Reconx-v1.2.0.apk
            dist/ReconX-Companion-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
